name: ai-security-prd-v11-test

services:
  database:
    image: ${PRD_POSTGRES_IMAGE:?Set an available PostgreSQL 16 image}
    env_file: ${PRD_STATE_DIR:?Set absolute persistent state directory}/database.env
    ports:
      - '127.0.0.1:${PRD_DB_PORT:-15432}:5432'
    volumes:
      - '${PRD_STATE_DIR}/postgres:/var/lib/postgresql/data'
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${PRD_NODE_IMAGE:?Set an available Node 24 image}
    network_mode: host
    working_dir: /app/services/quiz-svc
    command: ['node', 'dist/index.js']
    env_file: ${PRD_STATE_DIR}/api.env
    environment:
      NODE_ENV: production
      PORT: ${PRD_API_PORT:-14002}
      EVALUATION_PACKAGE_ROOT: /runtime/packages
      EVALUATION_WORKSPACE_ROOT: /runtime/workspaces
      EVALUATION_WORKSPACE_HOST_ROOT: ${PRD_STATE_DIR}/workspaces
      EVALUATION_GATEWAY_URL: http://host.docker.internal:${PRD_API_PORT:-14002}/api
    volumes:
      - '${PRD_RELEASE_DIR:?Set absolute immutable release directory}:/app:ro'
      - '${PRD_STATE_DIR}/uploads:/app/services/quiz-svc/uploads'
      - '${PRD_STATE_DIR}/resources:/app/services/quiz-svc/resources'
      - '${PRD_STATE_DIR}/auth-secret.json:/app/services/quiz-svc/auth-secret.json'
      - '${PRD_STATE_DIR}/llm-config.json:/app/services/quiz-svc/llm-config.json'
      - '${PRD_STATE_DIR}/github-archive-config.json:/app/services/quiz-svc/github-archive-config.json'
      - '${PRD_STATE_DIR}/packages:/runtime/packages'
      - '${PRD_STATE_DIR}/workspaces:/runtime/workspaces'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '${PRD_DOCKER_BINARY:?Set verified host Docker CLI path}:/usr/local/bin/docker:ro'
      - '${PRD_COMPOSE_PLUGIN:?Set verified host Compose plugin path}:/usr/local/lib/docker/cli-plugins/docker-compose:ro'
    restart: unless-stopped
    mem_limit: ${PRD_API_MEMORY_LIMIT:-2g}
    cpus: 2
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:"+process.env.PORT+"/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: ${PRD_NGINX_IMAGE:?Set an available nginx image}
    ports:
      - '${PRD_WEB_PORT:-50081}:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - '${PRD_RELEASE_DIR}/apps/web/dist:/usr/share/nginx/html:ro'
      - '${PRD_STATE_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
